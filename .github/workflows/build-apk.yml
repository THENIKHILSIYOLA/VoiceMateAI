name: Build VoiceMate AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Initialize Buildozer
        run: |
          buildozer init

      - name: Install Android SDK packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER=$(find "$SDK" -name sdkmanager -type f | head -n 1)

          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure Buildozer
        run: |
          sed -i 's/^# *title = .*/title = VoiceMate AI/' buildozer.spec
          sed -i 's/^# *package.name = .*/package.name = voicemateai/' buildozer.spec
          sed -i 's/^# *package.domain = .*/package.domain = org.voicemate/' buildozer.spec
          sed -i 's/^# *requirements = .*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/^# *android.api = .*/android.api = 35/' buildozer.spec
          sed -i 's/^# *android.minapi = .*/android.minapi = 23/' buildozer.spec
          sed -i 's/^# *android.arch = .*/android.arch = arm64-v8a/' buildozer.spec
          sed -i 's/^# *orientation = .*/orientation = portrait/' buildozer.spec

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMateAI-APK
          path: bin/*.apk
