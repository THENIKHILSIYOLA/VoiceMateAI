```yaml
name: Build VoiceMate AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP PYTHON 3.11
      # ==========================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 3. SETUP JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 4. INSTALL SYSTEM DEPENDENCIES
      # ==========================================

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================
      # 5. INSTALL BUILDOZER
      # ==========================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython==0.29.33"
          pip install buildozer


      # ==========================================
      # 6. CREATE BUILDOZER SPEC
      # ==========================================

      - name: Create buildozer.spec
        run: |
          buildozer init


      # ==========================================
      # 7. CONFIGURE BUILDOZER
      # ==========================================

      - name: Configure Buildozer
        run: |

          sed -i 's/^title = .*/title = VoiceMate AI/' buildozer.spec

          sed -i 's/^package.name = .*/package.name = voicemateai/' buildozer.spec

          sed -i 's/^package.domain = .*/package.domain = org.nikhil/' buildozer.spec

          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas/' buildozer.spec

          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec

          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

          sed -i 's/^android.api = .*/android.api = 33/' buildozer.spec

          sed -i 's/^android.minapi = .*/android.minapi = 24/' buildozer.spec

          sed -i 's/^android.archs = .*/android.archs = arm64-v8a/' buildozer.spec

          sed -i 's/^android.permissions = .*/android.permissions = INTERNET,RECORD_AUDIO/' buildozer.spec

          sed -i 's/^# android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec

          sed -i 's/^# android.accept_sdk_licenses = .*/android.accept_sdk_licenses = True/' buildozer.spec

          echo ""
          echo "=========================================="
          echo "BUILDOZER CONFIGURATION"
          echo "=========================================="
          cat buildozer.spec


      # ==========================================
      # 8. CLEAN OLD BUILD
      # ==========================================

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ==========================================
      # 9. BUILD APK
      # ==========================================

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug


      # ==========================================
      # 10. FIND APK
      # ==========================================

      - name: Find APK
        run: |
          echo "=========================================="
          echo "APK FILES"
          echo "=========================================="

          if [ -d bin ]; then
            find bin -type f -name "*.apk" -print
          else
            echo "ERROR: bin directory does not exist"
            exit 1
          fi


      # ==========================================
      # 11. UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMateAI-APK
          path: bin/*.apk
          if-no-files-found: error
```
