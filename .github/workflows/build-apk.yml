name: Build VoiceMate AI APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build VoiceMate AI APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget openjdk-17-jdk \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.34

      - name: Create buildozer.spec
        run: |
          buildozer init

      - name: Configure Buildozer
        run: |
          sed -i 's/^title = .*/title = VoiceMate AI/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = voicemateai/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.nikhil/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,speechrecognition/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          sed -i 's/^android.api = .*/android.api = 35/' buildozer.spec
          sed -i 's/^android.minapi = .*/android.minapi = 23/' buildozer.spec
          sed -i 's/^android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          sed -i 's/^android.permissions = .*/android.permissions = RECORD_AUDIO,INTERNET/' buildozer.spec
          sed -i 's/^# android.accept_sdk_licenses = .*/android.accept_sdk_licenses = True/' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Find APK
        run: |
          echo "======================================"
          echo "APK FILE"
          echo "======================================"
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMateAI-APK
          path: bin/*.apk
          if-no-files-found: error
